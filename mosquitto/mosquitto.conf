# Mosquitto Broker Configuration
user root

# Default listener (unencrypted) - only exposed inside Docker network for safety
listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# TLS-enabled listener - exposed publicly for secure hardware data ingestion
listener 8883
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# TLS Certificate files (auto-generated on container startup)
cafile /mosquitto/config/certs/ca.crt
certfile /mosquitto/config/certs/server.crt
keyfile /mosquitto/config/certs/server.key
require_certificate false
