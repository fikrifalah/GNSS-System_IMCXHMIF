services:
  postgres:
    image: postgres:16-alpine
    container_name: gnss_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    mem_limit: 400m
    networks:
      - gnss_network

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: gnss_mosquitto
    restart: always
    user: "root"
    volumes:
      - ./mosquitto:/mosquitto/config
    ports:
      - "1883:1883"
      - "8883:8883"
    environment:
      - OWNER=root
    command: >
      sh -c "
        apk add --no-cache openssl &&
        mkdir -p /mosquitto/config/certs &&
        if [ ! -f /mosquitto/config/certs/ca.crt ]; then
          echo 'Generating self-signed SSL certs...' &&
          openssl req -new -x509 -days 365 -extensions v3_ca -keyout /mosquitto/config/certs/ca.key -out /mosquitto/config/certs/ca.crt -subj '/CN=MyLocalCA' -nodes &&
          openssl genrsa -out /mosquitto/config/certs/server.key 2048 &&
          openssl req -out /mosquitto/config/certs/server.csr -key /mosquitto/config/certs/server.key -new -subj '/CN=mosquitto' &&
          openssl x509 -req -in /mosquitto/config/certs/server.csr -CA /mosquitto/config/certs/ca.crt -CAkey /mosquitto/config/certs/ca.key -CAcreateserial -out /mosquitto/config/certs/server.crt -days 365
        fi &&
        touch /mosquitto/config/passwd &&
        mosquitto_passwd -b /mosquitto/config/passwd ${MQTT_USER} ${MQTT_PASSWORD} &&
        mosquitto_passwd -b /mosquitto/config/passwd rover-01 ${ROVER_01_PASS} &&
        mosquitto_passwd -b /mosquitto/config/passwd rover-02 ${ROVER_02_PASS} &&
        mosquitto_passwd -b /mosquitto/config/passwd rover-03 ${ROVER_03_PASS} &&
        mosquitto_passwd -b /mosquitto/config/passwd rover-04 ${ROVER_04_PASS} &&
        mosquitto_passwd -b /mosquitto/config/passwd rover-05 ${ROVER_05_PASS} &&
        /usr/sbin/mosquitto -c /mosquitto/config/mosquitto.conf
      "
    mem_limit: 100m
    networks:
      - gnss_network

  api:
    build:
      context: ./api
    container_name: gnss_api
    restart: always
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - API_KEY=${API_KEY}
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app
      - ./LowCostGNSS Pemantauan.html:/app/LowCostGNSS Pemantauan.html
      - shared_storage:/app/storage
    depends_on:
      - postgres
    mem_limit: 350m
    networks:
      - gnss_network

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: gnss_worker
    restart: always
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
      - MQTT_USER=${MQTT_USER}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
    volumes:
      - ./worker:/app
      - ./api:/api
      - shared_storage:/app/storage
    depends_on:
      - postgres
      - mosquitto
    mem_limit: 350m
    networks:
      - gnss_network

volumes:
  pgdata:
  shared_storage:

networks:
  gnss_network:
    driver: bridge
